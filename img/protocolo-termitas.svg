  <text x="170" y="257" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Inspección con microondas</text>
  <text x="170" y="287" font-size="15.5" fill="#5d6b78">Detector sin romper la madera: mapa real de actividad en marcos, vigas, suelos y</text>

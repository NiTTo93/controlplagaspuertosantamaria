  <text x="170" y="557" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Tratamiento local</text>
  <text x="170" y="587" font-size="15.5" fill="#5d6b78">Inyección de insecticida en las galerías activas identificadas durante la</text>
  <text x="170" y="611" font-size="15.5" fill="#5d6b78">inspección.</text>

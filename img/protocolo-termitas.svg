  <text x="170" y="857" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Certificado anti-termitas</text>
  <text x="170" y="887" font-size="15.5" fill="#5d6b78">Documento de tratamiento válido para tu tranquilidad y el valor documental de la</text>
  <text x="170" y="911" font-size="15.5" fill="#5d6b78">vivienda.</text>

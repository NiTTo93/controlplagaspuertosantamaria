  <text x="170" y="707" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Monitorización 12 meses</text>
  <text x="170" y="737" font-size="15.5" fill="#5d6b78">Revisiones trimestrales de las estaciones: la termita subterránea se elimina con</text>
  <text x="170" y="761" font-size="15.5" fill="#5d6b78">seguimiento, no en una visita.</text>

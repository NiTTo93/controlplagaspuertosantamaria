  <text x="130" y="62" font-family="Sora, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Tratamiento anti-termitas</text>
  <text x="130" y="96" font-size="16" fill="#9fb0cd">Estaciones de cebo monitoreadas</text>
  <text x="130" y="122" font-size="13" fill="#6c82a8" letter-spacing="1">PROTOCOLO ESCUDO · EL PUERTO DE SANTA MARÍA</text>

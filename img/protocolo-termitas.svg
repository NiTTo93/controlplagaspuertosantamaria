  <text x="170" y="407" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Estaciones de cebo</text>
  <text x="170" y="437" font-size="15.5" fill="#5d6b78">Cajas selladas enterradas alrededor de la estructura: la termita transporta el</text>
  <text x="170" y="461" font-size="15.5" fill="#5d6b78">cebo a la colonia y elimina a la reina.</text>

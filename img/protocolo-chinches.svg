  <text x="115" y="581" font-family="Sora, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="170" y="557" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Residual profesional</text>
  <text x="170" y="587" font-size="15.5" fill="#5d6b78">Insecticida de larga duración en grietas, zócalos y escondites estructurales —</text>
  <text x="170" y="611" font-size="15.5" fill="#5d6b78">nunca en el colchón.</text>

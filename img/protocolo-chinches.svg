  <text x="130" y="62" font-family="Sora, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Erradicación de chinches de cama</text>
  <text x="130" y="96" font-size="16" fill="#9fb0cd">Calor a 120°C + protocolo de 2 visitas</text>
  <text x="130" y="122" font-size="13" fill="#6c82a8" letter-spacing="1">PROTOCOLO ESCUDO · EL PUERTO DE SANTA MARÍA</text>
  <rect x="60" y="205" width="880" height="130" rx="16" fill="#EEF3FC"/>
  <circle cx="115" cy="270" r="30" fill="#2361EB"/>
  <text x="115" y="281" font-family="Sora, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="170" y="257" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Inspección exhaustiva</text>
  <text x="170" y="287" font-size="15.5" fill="#5d6b78">Colchón, somier, cabecero, zócalos, tomas y cortinas: la chinche vive en un radio</text>
  <text x="170" y="311" font-size="15.5" fill="#5d6b78">de 2 metros de la cama.</text>

  <text x="170" y="707" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Segunda visita a 21 días</text>
  <text x="170" y="737" font-size="15.5" fill="#5d6b78">Cubre las ninfas nacidas de los huevos supervivientes. Quien promete chinches en</text>
  <text x="170" y="761" font-size="15.5" fill="#5d6b78">una visita, miente.</text>

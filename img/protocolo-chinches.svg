  <text x="170" y="857" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Protocolo textil</text>
  <text x="170" y="887" font-size="15.5" fill="#5d6b78">Guía escrita de lavado a 60°C y secadora para cada prenda: la mitad del éxito es</text>
  <text x="170" y="911" font-size="15.5" fill="#5d6b78">el cliente bien instruido.</text>

  <text x="115" y="431" font-family="Sora, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="170" y="407" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#13213B">Vapor seco a 120°C</text>
  <text x="170" y="437" font-size="15.5" fill="#5d6b78">Colchón y somier tratados con calor instantáneo: mata todos los estados (huevo</text>
  <text x="170" y="461" font-size="15.5" fill="#5d6b78">incluido) sin químicos en superficies de contacto.</text>
